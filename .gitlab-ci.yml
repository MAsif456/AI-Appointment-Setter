stages:
  - test
  - build
  - deploy

default:
  image: node:20

variables:
  COVERAGE_THRESHOLD: '{"global":{"branches":75,"functions":75,"lines":75,"statements":75}}'
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

# --- Backend tests ---
test:backend:
  stage: test
  services:
    - mongo:7
  variables:
    MONGODB_URI: "mongodb://mongo:27017/test_db"
    FRONTEND_URL: "http://localhost:3000"
    JEST_JUNIT_OUTPUT_DIR: "./reports"
  before_script:
    - cd backend
    - npm ci
  script:
    - npx jest --coverage --coverageReporters=text --coverageReporters=cobertura --coverageThreshold="$COVERAGE_THRESHOLD" --passWithNoTests --forceExit --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    reports:
      junit: backend/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml

# --- Frontend tests ---
test:frontend:
  stage: test
  variables:
    JEST_JUNIT_OUTPUT_DIR: "./reports"
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx jest --coverage --coverageReporters=text --coverageReporters=cobertura --coverageThreshold="$COVERAGE_THRESHOLD" --passWithNoTests --forceExit --reporters=default --reporters=jest-junit
  artifacts:
    when: always
    reports:
      junit: frontend/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# --- Build backend ---
build:backend:
  stage: build
  before_script:
    - cd backend
    - npm ci
  script:
    - npm run build

# --- Build frontend ---
build:frontend:
  stage: build
  before_script:
    - cd frontend
    - rm -rf node_modules
    - npm install
  script:
    - npm run build

# --- Deploy to Vercel (Frontend) ---
deploy:vercel:
  stage: deploy
  retry: 2
  only:
    - development
  script:
    - npm install --global vercel
    - export VERCEL_GIT_COMMIT_AUTHOR_LOGIN=$VERCEL_GIT_COMMIT_AUTHOR_LOGIN
    - export VERCEL_GIT_COMMIT_AUTHOR_NAME=$VERCEL_GIT_COMMIT_AUTHOR_NAME
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --force --token=$VERCEL_TOKEN

# --- Deploy to Render (Backend) ---
deploy:render:
  stage: deploy
  only:
    - development
  script:
    - |
      if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
        echo "Error: RENDER_DEPLOY_HOOK_URL not found in CI/CD Variables."
        exit 1
      fi
    - curl -X POST "$RENDER_DEPLOY_HOOK_URL"