stages:
  - test
  - build

default:
  image: node:20-alpine

variables:
  COVERAGE_THRESHOLD: '{"global":{"branches":75,"functions":75,"lines":75,"statements":75}}'
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

# --- Backend tests ---
test:backend:
  stage: test
  services:
    - mongo:7
  variables:
    MONGODB_URI: "mongodb://mongo:27017/test_db"
    FRONTEND_URL: "http://localhost:3000"
  before_script:
    - cd backend
    - npm ci
  script:
    - npx jest --coverage --coverageThreshold="$COVERAGE_THRESHOLD" --passWithNoTests --forceExit
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'

# --- Frontend tests ---
test:frontend:
  stage: test
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx jest --coverage --coverageThreshold="$COVERAGE_THRESHOLD" --passWithNoTests --forceExit
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'

# --- Build backend ---
build:backend:
  stage: build
  before_script:
    - cd backend
    - npm ci
  script:
    - npm run build

# --- Build frontend ---
build:frontend:
  stage: build
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build