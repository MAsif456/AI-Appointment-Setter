stages:
  - test
  - build

default:
  image: node:20

variables:
  COVERAGE_THRESHOLD: '{"global":{"branches":75,"functions":75,"lines":75,"statements":75}}'
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

# --- Backend tests ---
test:backend:
  stage: test
  services:
    - mongo:7
  variables:
    MONGODB_URI: "mongodb://mongo:27017/test_db"
    FRONTEND_URL: "http://localhost:3000"
    JEST_JUNIT_OUTPUT_DIR: "./reports"
  before_script:
    - cd backend
    - npm ci
  script:
    - npx jest --coverage --coverageReporters=text --coverageReporters=cobertura --coverageThreshold="$COVERAGE_THRESHOLD" --passWithNoTests --forceExit --reporters=default --reporters=jest-junit
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    when: always
    reports:
      junit: backend/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage/cobertura-coverage.xml

# --- Frontend tests ---
test:frontend:
  stage: test
  variables:
    JEST_JUNIT_OUTPUT_DIR: "./reports"
  before_script:
    - cd frontend
    - npm ci
    - npm rebuild lightningcss
  script:
    - npx jest --coverage --coverageReporters=text --coverageReporters=cobertura --coverageThreshold="$COVERAGE_THRESHOLD" --passWithNoTests --forceExit --reporters=default --reporters=jest-junit
  coverage: '/All files\s*\|\s*(\d+\.?\d*)\s*\|/'
  artifacts:
    when: always
    reports:
      junit: frontend/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

# --- Build backend ---
build:backend:
  stage: build
  before_script:
    - cd backend
    - npm ci
  script:
    - npm run build

# --- Build frontend ---
build:frontend:
  stage: build
  before_script:
    - cd frontend
    - npm ci
    - npm rebuild lightningcss
  script:
    - npm run build